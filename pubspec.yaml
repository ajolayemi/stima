name: stima
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # routing
  go_router: ^17.2.3

  # state management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.2

  # ui
  flutter_svg: ^2.2.1
  cached_network_image: ^3.4.1

  # localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # misc
  collection: ^1.19.1
  package_info_plus: ^9.0.0
  device_info_plus: ^12.1.0
  json_annotation: ^4.9.0
  app_links: ^7.0.0
  url_launcher: ^6.3.2
  version: ^3.0.2
  freezed_annotation: ^3.1.0
  dio: ^5.9.0
  path_provider: ^2.1.5
  path: ^1.9.1
  dotted_border: ^3.1.0
  file_picker: ^10.3.3
  xml: ^6.6.1
  
  # auth
  google_sign_in: ^7.2.0

  # logging
  logging: ^1.3.0

  # firebase related
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  firebase_remote_config: ^6.0.2
  firebase_crashlytics: ^5.2.0
  cloud_firestore: ^6.0.2
  cloud_functions: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_flavorizr: ^2.4.1
  riverpod_lint: ^3.0.0
  riverpod_generator: ^4.0.3
  flutter_launcher_icons: ^0.14.4
  json_serializable: ^6.11.1
  build_runner: ^2.15.0
  freezed: ^3.2.3

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/config/

  fonts:
    - family: RobotoLight
      fonts:
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
    - family: RobotoRegular
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
    - family: RobotoMedium
      fonts:
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
    - family: RobotoBold
      fonts:
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700  

flutter_gen:
  output: lib/gen/

  integrations:
    flutter_svg: true
  
  assets:
   enabled: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21