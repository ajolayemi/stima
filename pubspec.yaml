name: stima
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # routing
  go_router: ^17.2.3

  # state management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.2

  # ui
  flutter_svg: ^2.2.1
  cached_network_image: ^3.4.1

  # localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # misc
  collection: ^1.19.1
  package_info_plus: ^9.0.0
  device_info_plus: ^12.1.0
  json_annotation: ^4.9.0
  app_links: ^7.0.0
  url_launcher: ^6.3.2
  version: ^3.0.2

  # auth
  google_sign_in: ^7.2.0

  # logging
  logging: ^1.3.0

  # firebase related
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  firebase_remote_config: ^6.0.2
  firebase_crashlytics: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_flavorizr: ^2.4.1
  riverpod_lint: ^3.0.0
  riverpod_generator: ^4.0.3
  flutter_launcher_icons: ^0.14.4
  json_serializable: ^6.11.1
  build_runner: ^2.15.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files
  generate: true

  assets:
    - assets/images/
    - assets/icons/

flutter_gen:
  output: lib/gen/

  integrations:
    flutter_svg: true
  
  assets:
   enabled: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21